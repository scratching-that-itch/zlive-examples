<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ziggy view:form</title>

<link rel="stylesheet" href="/zc.css">


</head>
<body>


<h1>view:form — validated live</h1>
<p class="chrome"><button type="button" onclick="zcTheme.toggle()">theme</button></p>
<p>
  Errors appear (and disappear) as diffs while you type. Submitting shows a
  server-side loading state.
  <a href="/">&larr; back to counter</a> · <a href="/table">table demo &rarr;</a>
</p>

<div id="lv">connecting…</div>
<ul id="log"></ul>


<script src="https://unpkg.com/morphdom@2.6.1/dist/morphdom-umd.js"></script>

<script src="client.js"></script>
<script src="hooks.js"></script>
<script src="theme.js"></script>

<script>
Live.start({ container: 'lv', log: 'log', topic: 'view:form' });

// submit through the protocol, not a page reload
document.getElementById('lv').addEventListener('submit', (ev) => {
  ev.preventDefault();
  Live.send('submit');
});
</script>


</body>
</html>

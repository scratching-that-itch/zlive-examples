<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ziggy view:counter</title>

<link rel="stylesheet" href="/zc.css">


</head>
<body>


<h1>view:counter</h1>
<p class="chrome">
  <button type="button" onclick="Live.send('flash', {message: 'Saved!', ttl_ms: 15000})">flash</button>
  <button type="button" onclick="Live.disconnect()">disconnect (test backoff)</button>
  <button type="button" onclick="zcTheme.toggle()">theme</button>
  <a href="/">&larr; kitchen sink</a> · <a href="/table">table &rarr;</a> · <a href="/form">form &rarr;</a> · <a href="/tabs">tabs &rarr;</a> · <a href="/countries">countries &rarr;</a>
</p>

<div id="lv">connecting…</div>
<ul id="log"></ul>


<script src="https://unpkg.com/morphdom@2.6.1/dist/morphdom-umd.js"></script>

<script src="client.js"></script>
<script src="hooks.js"></script>
<script src="theme.js"></script>

<script>
// demo hook: logs its lifecycle events to the page log and the console.
// Registered before Live.start so the initial render mounts it immediately.
LiveHooks.register('demo', {
  mounted(el) {
    const msg = 'demo mounted: <' + el.tagName.toLowerCase() + '> "' + el.textContent.trim() + '"';
    const li = document.createElement('li');
    li.className = 'hook';
    li.textContent = msg;
    document.getElementById('log').appendChild(li);
    console.log('[hook]', msg);
  },
  updated(el) {
    console.log('[hook] demo updated: "' + el.textContent.trim() + '"');
  },
  destroyed(el) {
    const msg = 'demo destroyed: "' + el.textContent.trim() + '"';
    const li = document.createElement('li');
    li.className = 'hook';
    li.textContent = msg;
    document.getElementById('log').appendChild(li);
    console.log('[hook]', msg);
  },
});

Live.start({ container: 'lv', log: 'log' });
</script>


</body>
</html>

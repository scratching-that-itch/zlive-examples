<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ziggy sidebar — shadcn's sidebar-07</title>

<link rel="stylesheet" href="/zc.css">

<style>
  /* The block's own layout, which in shadcn is Tailwind classes inside the
     page component: a full-bleed dashboard, a header bar, and the two
     placeholder surfaces. `SidebarLayout` and `SiteHeader` supply the frame;
     this is the page inside it. */
  body { max-width: none; margin: 0; }
  #lv { min-height: 100svh; }

  /* The header's vertical rule (shadcn: `orientation="vertical" h-4`); the
     site header's own height and sticky behaviour live in the component. */
  #lv .dash-header-sep { height: 1rem; align-self: center; margin: 0 0.5rem 0 0; }
  .dash-spacer { flex: 1; }
  /* shadcn hides the breadcrumb on small screens (`hidden sm:block`). */
  @media (max-width: 639px) { #lv .dash-crumb { display: none; } }

  .dash-body { display: flex; flex: 1; flex-direction: column; gap: 1rem;
               padding: 1rem; }
  .dash-grid { display: grid; gap: 1rem; }
  @media (min-width: 768px) { .dash-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .dash-card { aspect-ratio: 16 / 9; border-radius: var(--radius-xl);
               background: color-mix(in oklab, var(--muted) 50%, transparent); }
  /* One screen of filler, so the sticky header has something to scroll
     against (shadcn's blocks use `min-h-[100vh]` for the same reason). */
  .dash-panel { flex: 1; min-height: 100vh; border-radius: var(--radius-xl);
                background: color-mix(in oklab, var(--muted) 50%, transparent); }

  /* The block's sidebar internals: the team switcher's logo square and the
     two-line name/plan (shadcn: size-8 rounded-lg bg-sidebar-primary …). */
  .dash-logo { display: flex; aspect-ratio: 1; width: 2rem; align-items: center;
               justify-content: center; border-radius: var(--radius-lg);
               background: var(--sidebar-primary); color: var(--sidebar-primary-foreground); }
  .dash-logo .zc-icon { width: 1rem; height: 1rem; }
  .dash-lines { display: grid; flex: 1; min-width: 0; text-align: left;
                font-size: 0.875rem; line-height: 1.25; }
  .dash-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               font-weight: 500; }
  .dash-line-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                   font-size: 0.75rem; color: var(--muted-foreground); }
  .dash-muted-row { color: color-mix(in oklab, var(--sidebar-foreground) 70%, transparent); }

  /* The sidebar's menus open beside the rail. shadcn gives them the trigger's
     width with a floor (teams/user: `min-w-56`, the rail's nav popups `w-48`);
     the library's default menu min-width (8rem) is narrower than either, so
     the block sizes them here, by anchor id. */
  #lv .zc-dropdown[data-zc-anchor="sb-team"],
  #lv .zc-dropdown[data-zc-anchor="sb-user"] { min-width: 14rem; }
  #lv .zc-dropdown[data-zc-anchor^="sb-nav-"] { min-width: 12rem; }

  /* The layout popover: one labeled row per component option. */
  .dash-pop-title { margin: 0 0 0.5rem; font-size: 0.75rem; font-weight: 500;
                    color: var(--muted-foreground); }
  .dash-pop-title + .dash-pop-title, .dash-pop-row + .dash-pop-title {
    margin-top: 0.875rem; }
  .dash-pop-row { display: flex; align-items: center; gap: 0.5rem;
                  margin-bottom: 0.5rem; }
  .dash-pop-label { width: 4.75rem; flex-shrink: 0; font-size: 0.75rem;
                    color: var(--muted-foreground); }
  .dash-pop-opts { display: flex; flex-wrap: wrap; gap: 0.375rem; }
  .dash-pop-note { margin: 0.75rem 0 0; max-width: 16rem; font-size: 0.75rem;
                   color: var(--muted-foreground); }

  /* The protocol log: this is a demo, so it stays on screen. */
  #log { position: fixed; right: 1rem; bottom: 1rem; z-index: 50; width: 22rem;
         max-width: calc(100vw - 2rem); height: 10rem; margin: 0;
         background: var(--card); box-shadow: var(--shadow-md); }
</style>


</head>
<body>


<div id="lv">connecting…</div>
<ul id="log"></ul>


<script src="https://unpkg.com/morphdom@2.6.1/dist/morphdom-umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@floating-ui/core@1.6.8/dist/floating-ui.core.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.13/dist/floating-ui.dom.umd.min.js"></script>

<script src="client.js"></script>
<script src="hooks.js"></script>
<script src="theme.js"></script>

<script>
  // shadcn keeps the sidebar's open state in a cookie and reads it back on
  // the next load; the hook writes it, so the server can be told here.
  function sidebarCookie() {
    try {
      const m = document.cookie.match(/(?:^|;\s*)sidebar_state=([^;]+)/);
      return m ? m[1] : '1';
    } catch { return '1'; }
  }
  Live.start({
    container: 'lv', log: 'log', topic: 'view:sidebar',
    join: { sidebar: sidebarCookie() },
  });
</script>


</body>
</html>

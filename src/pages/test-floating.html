{% extends "base.html" %}

{% block title %}floating probe{% endblock %}

{% block body %}
<button id="anchor" type="button">anchor</button>
<div id="float" style="position:fixed; background:#fff; border:1px solid #ccc; padding:0.5rem">floating</div>
<pre id="out">probing…</pre>
{% endblock %}

{% block scripts %}
{% include "floating.html" %}
<script>
const out = [];
out.push('typeof FloatingUIDOM: ' + typeof window.FloatingUIDOM);
if (window.FloatingUIDOM) {
  out.push('keys: ' + Object.keys(window.FloatingUIDOM).join(','));
  out.push('has core global: ' + ('FloatingUICore' in window));
}
try {
  window.FloatingUIDOM.computePosition(
    document.getElementById('anchor'),
    document.getElementById('float'),
    { strategy: 'fixed', placement: 'bottom-start' }
  ).then(({ x, y }) => {
    out.push('position: ' + x + ',' + y);
    document.getElementById('float').style.left = x + 'px';
    document.getElementById('float').style.top = y + 'px';
    out.push('done');
    document.getElementById('out').textContent = out.join('\n');
  }).catch(e => {
    out.push('reject: ' + e.message);
    document.getElementById('out').textContent = out.join('\n');
  });
} catch (e) {
  out.push('throw: ' + e.message);
  document.getElementById('out').textContent = out.join('\n');
}
setTimeout(() => {
  if (!document.getElementById('out').textContent.includes('\n')) {
    document.getElementById('out').textContent = out.join('\n') + '\ntimeout';
  }
}, 2000);
</script>
{% endblock %}
